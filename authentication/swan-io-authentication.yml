- name: oauth2ClientCredentials
  type: oauth2
  flow: clientCredentials
  tokenUrl: https://oauth.swan.io/oauth2/token
  description: 'Server-to-server access. Exchange your Project Client ID and Client
    Secret (from the Swan dashboard under Developers > API) for an access token,
    then send it as `Authorization: Bearer $ACCESS_TOKEN`. Used for Partner API
    calls that act on behalf of the Project.'
