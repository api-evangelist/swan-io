aid: swan-io
url: https://raw.githubusercontent.com/api-evangelist/swan-io/refs/heads/main/apis.yml
name: Swan
kind: company
description: Swan is a European embedded-banking / Banking-as-a-Service (BaaS)
  platform, headquartered in France, that lets companies embed accounts, IBANs,
  cards, and SEPA payments into their own products. Swan holds an Electronic Money
  Institution (EMI) license and exposes a single GraphQL API covering accounts,
  account holders, account memberships, IBAN management, card issuing,
  transactions, SEPA credit transfers and direct debits, digital onboarding,
  users, and consents. Integrations are backend-only, authenticated with OAuth2
  (client credentials for server-to-server and authorization code for user
  access tokens) and scoped to a partner Project, with separate Sandbox and Live
  environments.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Embedded Banking
- Banking as a Service
- BaaS
- Payments
- Accounts
- Cards
- IBAN
- SEPA
- Europe
- France
- Fintech
- GraphQL
